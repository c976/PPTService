name: Build and Release PPTService

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动触发工作流

# 授予工作流写权限，解决 403 无法创建 Release 的问题
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 修复 .NET Framework 4.5 引用程序集缺失 (解决 MSB3644 错误)
    - name: Inject .NET Framework 4.5 Reference Assemblies
      shell: pwsh
      run: |
        $net45SdkUrl = 'https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net45/1.0.3'
        $sdkSystemPath = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework'
        $tempZip = Join-Path $env:TEMP 'net45sdk.zip'
        $tempExtract = Join-Path $env:TEMP 'net45sdk'
        
        Write-Host "Downloading .NET 4.5 Reference Assemblies..."
        Invoke-WebRequest -Uri $net45SdkUrl -OutFile $tempZip
        
        Write-Host "Extracting..."
        Expand-Archive -Path $tempZip -DestinationPath $tempExtract -Force
        
        Write-Host "Moving to system directory..."
        $v45Path = Join-Path $sdkSystemPath 'v4.5'
        if (Test-Path $v45Path) {
            Remove-Item -Path $v45Path -Recurse -Force
        }
        
        $sourcePath = Join-Path $tempExtract 'build\.NETFramework\v4.5'
        Move-Item -Path $sourcePath -Destination $sdkSystemPath -Force
        Write-Host "Successfully injected .NET 4.5 Reference Assemblies."

    # 编译解决方案 (Release)
    - name: Build solution (Release)
      run: msbuild PPTService.sln /p:Configuration=Release /p:TargetFrameworkVersion=v4.5 /m /verbosity:minimal

    # 安装 NSIS 3.11 完整版，并覆盖 log 补丁包（makensis.exe / zlib1.dll / Stubs 均为 log 构建）
    # 注意：SourceForge 下载必须用 curl.exe（Invoke-WebRequest 会拿到 HTML 而非 zip）
    - name: Install NSIS 3.11 (log build)
      shell: pwsh
      run: |
        $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis-3.11'
        $fullZip   = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
        $logZip    = Join-Path $env:RUNNER_TEMP 'nsis-3.11-log.zip'

        curl.exe -L --retry 3 -o $fullZip "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip"
        curl.exe -L --retry 3 -o $logZip  "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-log.zip"

        Expand-Archive -Path $fullZip -DestinationPath $env:RUNNER_TEMP -Force
        # log 补丁包没有顶层目录，直接解压覆盖到 nsis-3.11 内
        Expand-Archive -Path $logZip -DestinationPath $nsisRoot -Force

        Add-Content $env:GITHUB_PATH "$nsisRoot\Bin"
        Write-Host "NSIS installed at $nsisRoot\Bin"

    # 执行打包脚本（makensis 已通过 GITHUB_PATH 加入 PATH）
    - name: Run build.cmd (NSIS)
      shell: cmd
      run: |
        cd setup
        call build.cmd

    # 读取本次构建实际使用的产品版本号，作为 Release 的 tag。
    # 二次开发副本：MSBuild 生成的 setup\Version.nsh；原版仓库回退到 PPTService.nsi 里的 !define。
    - name: Read product version
      id: product_version
      shell: pwsh
      run: |
        $versionFile = './setup/Version.nsh'
        if (-not (Test-Path $versionFile)) { $versionFile = './setup/PPTService.nsi' }
        $content = Get-Content -Path $versionFile -Raw
        if ($content -match '(?m)^\s*!define\s+PRODUCT_VERSION\s+"([^"]+)"') {
          $version = $Matches[1]
        } else {
          throw "Cannot find PRODUCT_VERSION in $versionFile"
        }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
        Write-Host "Release tag will be: $version"

    # tag 使用版本号（如 1.0.0.799）；同一版本重跑时覆盖已有 Release 的附件，不再使用 latest 滚动 tag。
    - name: Publish release tagged with product version
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.product_version.outputs.version }}
      shell: pwsh
      run: |
        $tag = $env:RELEASE_TAG
        $asset = './setup/PPTServiceUltraSetup.exe'
        $notes = "Auto-generated build of $tag`nCommit: $($env:GITHUB_SHA)`nBranch: $($env:GITHUB_REF_NAME)"

        # 迁移：删掉旧的 latest 滚动发布（若存在）
        gh release delete latest --yes --cleanup-tag 2>$null

        $null = gh release view $tag --json tagName 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Host "Release $tag already exists - replacing the installer asset."
          gh release upload $tag $asset --clobber
          gh release edit $tag --notes $notes
        } else {
          gh release create $tag $asset --title "PPTServiceUltra $tag" --notes $notes --latest
        }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }